name: RishiFy v0.5 Android build and upgrade gate

on:
  push:
    branches:
      - personal-music-v0.5-mobile
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v0.5 app and pinned playback core
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle
      - name: Apply original RishiFy branding
        shell: bash
        run: |
          set -euo pipefail
          base64 -d branding/rishify_icon.b64 > /tmp/rishify_icon.png
          cp /tmp/rishify_icon.png androidApp/src/main/res/drawable/app_icon.png
          cp /tmp/rishify_icon.png composeApp/src/commonMain/composeResources/drawable/app_icon.png
          cp /tmp/rishify_icon.png composeApp/src/commonMain/composeResources/drawable/circle_app_icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="androidApp/src/main/res/mipmap-$density"
            rm -f "$dir/ic_launcher.webp" "$dir/ic_launcher_round.webp" "$dir/ic_launcher_foreground.webp"
            cp /tmp/rishify_icon.png "$dir/ic_launcher.png"
            cp /tmp/rishify_icon.png "$dir/ic_launcher_round.png"
            cp /tmp/rishify_icon.png "$dir/ic_launcher_foreground.png"
          done
      - name: Configure personal Android build
        shell: bash
        run: |
          printf '\nisFullBuild=true\n' >> gradle.properties
          printf 'SENTRY_DSN=\nSENTRY_AUTH_TOKEN=\nLASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
      - name: Compile v0.5 Android APK
        run: |
          ./gradlew exportLibraryDefinitions
          ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Verify upgrade identity against actual v0.4 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11881166919/zip" \
            -o /tmp/v04.zip
          mkdir -p /tmp/rishify-v04
          unzip -q /tmp/v04.zip -d /tmp/rishify-v04
          echo "Archived v0.4 APKs:"
          find /tmp/rishify-v04 -type f -name '*.apk' -print
          echo "New v0.5 APKs:"
          find androidApp/build/outputs/apk/debug -type f -name '*.apk' -print
          OLD_APK="$(find /tmp/rishify-v04 -type f -name '*.apk' -print -quit)"
          NEW_APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [[ -z "$OLD_APK" || -z "$NEW_APK" ]]; then
            echo "::error::Could not identify both APKs in build outputs."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$OLD_APK" > /tmp/v04-signers.txt
          "$APKSIGNER" verify --print-certs "$NEW_APK" > /tmp/v05-signers.txt
          # apksigner 37 reports "V2 Signer: certificate SHA-256 digest" for these APKs.
          # Match the certificate label rather than the version-specific signer prefix.
          oldcert="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/v04-signers.txt)"
          newcert="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/v05-signers.txt)"
          "$AAPT" dump badging "$OLD_APK" > /tmp/v04-badging.txt
          "$AAPT" dump badging "$NEW_APK" > /tmp/v05-badging.txt
          oldbadging="$(sed -n '1p' /tmp/v04-badging.txt)"
          newbadging="$(sed -n '1p' /tmp/v05-badging.txt)"
          oldpkg="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$oldbadging")"
          newpkg="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$newbadging")"
          oldver="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$oldbadging")"
          newver="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$newbadging")"
          echo "Old package=$oldpkg version=$oldver signer=$oldcert"
          echo "New package=$newpkg version=$newver signer=$newcert"
          if [[ "$newpkg" != "$oldpkg" || -z "$oldpkg" ]]; then
            echo "::error::Application ID mismatch. Upgrade would be a different installation."
            exit 1
          fi
          if [[ "$newver" -le "$oldver" ]]; then
            echo "::error::Version code must be higher to upgrade."
            exit 1
          fi
          if [[ "$newcert" != "$oldcert" || -z "$oldcert" ]]; then
            echo "::error::Signing certificate mismatch. Do not uninstall v0.4 or distribute this APK as an update."
            exit 1
          fi
      - name: Upload upgrade-compatible candidate
        uses: actions/upload-artifact@v4
        with:
          name: rishify-v0.5-upgrade-compatible
          path: androidApp/build/outputs/apk/debug/*arm64-v8a-debug.apk
          if-no-files-found: error
