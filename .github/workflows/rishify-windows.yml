name: RishiFy Windows MSI

on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-windows-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Configure FOSS desktop build
        shell: pwsh
        run: |
          Add-Content gradle.properties ""
          Add-Content gradle.properties "isFullBuild=false"
          @"
          SENTRY_DSN=
          SENTRY_AUTH_TOKEN=
          LASTFM_API_KEY=
          LASTFM_SECRET=
          "@ | Set-Content local.properties

      - name: Generate RishiFy Windows icon
        shell: pwsh
        run: |
          $b64 = (Get-Content branding/rishify_icon.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\rishify.png", [Convert]::FromBase64String($b64))
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          import os
          src = os.path.join(os.environ["RUNNER_TEMP"], "rishify.png")
          img = Image.open(src).convert("RGBA")
          out = os.path.join("composeApp", "icon", "circle_app_icon.ico")
          img.save(out, format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print("Generated", out)
          '@ | python -

      - name: Generate library metadata
        shell: pwsh
        run: ./gradlew.bat exportLibraryDefinitions

      - name: Stage Windows x64 mpv natives
        shell: pwsh
        run: |
          $url = "https://github.com/maxrave-dev/simpmusic-files/releases/download/abc/mpv-natives-windows-x64.tar.gz"
          $archive = "$env:RUNNER_TEMP\mpv-windows-x64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $expected = "256f17cf402c7583b8684d5a7cf585ad1b59695469219671f4887b9d8d272a99"
          if ($actual -ne $expected) { throw "mpv native checksum mismatch: $actual" }
          New-Item -ItemType Directory -Force -Path mpv-natives | Out-Null
          tar -xzf $archive -C mpv-natives
          Get-ChildItem -Recurse mpv-natives\windows-x64

      - name: Build RishiFy MSI
        shell: pwsh
        run: ./gradlew.bat :desktopApp:packageMsi --no-configuration-cache --stacktrace

      - name: Show MSI
        shell: pwsh
        run: Get-ChildItem -Recurse desktopApp\build -Filter *.msi | Format-Table FullName,Length

      - name: Upload RishiFy Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RishiFy-Windows-x64-MSI
          path: desktopApp/build/**/*.msi
          if-no-files-found: error
