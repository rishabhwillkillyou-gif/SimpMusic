name: Personal Music Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev ]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Configure personal build
        shell: bash
        run: |
          echo "" >> gradle.properties
          echo "isFullBuild=true" >> gradle.properties
          echo "SENTRY_DSN=" > local.properties
          echo "SENTRY_AUTH_TOKEN=" >> local.properties
          echo "LASTFM_API_KEY=" >> local.properties
          echo "LASTFM_SECRET=" >> local.properties

      - name: Generate library metadata
        run: ./gradlew exportLibraryDefinitions

      - name: Build installable debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-music-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
